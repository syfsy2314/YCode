[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ycode"
version = "0.1.0"
description = "A Windows terminal AI assistant with streaming conversations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "pathspec>=0.12",
    "pydantic>=2",
    "PyYAML>=6",
    "prompt-toolkit>=3.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.scripts]
ycode = "ycode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ycode*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
